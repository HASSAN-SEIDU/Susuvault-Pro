<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SusuVault Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;min-height:100vh;padding:10px}
.header{background:#111;border:2px solid #FFD700;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:900;font-size:20px}.y{color:#FFD700}.w{color:#fff}
.badge{background:#FFD700;color:#000;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:#fff;color:#000;border-radius:12px;padding:12px;text-align:center}
.stat small{color:#888;font-size:10px;display:block}.stat b{font-size:18px}
.main{background:#fff;color:#000;border-radius:16px;padding:15px}
.tabs{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;padding-bottom:5px}
.tab{padding:8px 12px;border-radius:20px;border:2px solid #000;background:#fff;color:#000;font-weight:700;font-size:12px;white-space:nowrap;cursor:pointer}
.tab.active{background:#000;color:#FFD700}
input{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:5px 0;font-size:14px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin-top:8px}
.btn-black{background:#000;color:#FFD700}.btn-gold{background:#FFD700;color:#000}
.cust{background:#f5f5f5;border-left:4px solid #FFD700;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
.pbtn{background:#25D366;color:#fff;border:none;padding:7px 12px;border-radius:6px;font-weight:700;cursor:pointer}
.dbtn{background:#ff4444;color:#fff;border:none;padding:7px 10px;border-radius:6px;cursor:pointer;margin-left:5px}
.hidden{display:none}
.footer{text-align:center;color:#666;font-size:10px;margin-top:12px}
</style>
</head>
<body>
<div class="header">
<div class="logo"><span class="y">SUSU</span><span class="w">VAULT PRO</span></div>
<div class="badge">PRO ACTIVE ✓</div>
</div>
<div class="stats">
<div class="stat"><small>TOTAL CUSTOMERS</small><b id="totalCust">0</b></div>
<div class="stat"><small>TODAY COLLECTED</small><b id="todayColl">GH₵0</b></div>
