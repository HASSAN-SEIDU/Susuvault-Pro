<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SusuVault Pro - Activation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;color:#000;width:100%;max-width:400px;border-radius:20px;padding:25px;border:3px solid #FFD700;text-align:center}
.logo{font-weight:900;font-size:28px;margin-bottom:5px}.logo .y{color:#FFC300}.logo .w{color:#000}
.badge{background:#000;color:#FFD700;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900;display:inline-block;margin-bottom:15px}
input{width:100%;padding:14px;border:2px solid #000;border-radius:12px;margin:8px 0;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}
.btn-gold{background:#FFD700;color:#000}
.btn-black{background:#000;color:#FFD700}
.price{background:#FFF9C4;border:2px dashed #FFD700;padding:12px;border-radius:12px;margin:12px 0}
</style>
</head>
<body>
<div class="card">
<div class="logo"><span class="y">SUSU</span><span class="w">VAULT PRO</span></div>
<div class="badge">GH₵250 LIFETIME LICENSE</div>
<p style="font-size:13px;color:#555">Professional Susu Collection System</p>

<div class="price">
<b>Pay GH₵250 to Activate</b><br>
<small>MoMo: <b>0248643827</b><br>Name: Hassan Seidu</small>
</div>

<input id="custName" placeholder="Your Full Name">
<input id="custPhone" placeholder="Your WhatsApp Number e.g. 024...">
<button class="btn btn-gold" onclick="requestCode()">REQUEST ACTIVATION CODE</button>

<div style="margin:15px 0;border-top:2px solid #eee;padding-top:15px">
<input id="actCode" placeholder="Enter Activation Code e.g. SUSU250">
<button class="btn btn-black" onclick="activate()">ACTIVATE PRO NOW ✓</button>
</div>

<p style="font-size:11px;color:#888;margin-top:10px">After payment, you will get code via WhatsApp.<br>Contact: 0248643827</p>
</div>

<script>
function requestCode(){
let n=document.getElementById('custName').value;
let p=document.getElementById('custPhone').value;
if(!n||!p){alert('Enter name and phone');return;}
let msg=`Hello Hassan! I want to buy SusuVault Pro GH₵250%0AName: ${n}%0APhone: ${p}%0AMoMo: 0248643827`;
window.open(`https://wa.me/233248643827?text=${msg}`,'_blank');
}
function activate(){
let code=document.getElementById('actCode').value.trim().toUpperCase();
let valid=['SUSU250','HASSAN2026','SUSU-GH250','PRO250','SUSUPRO'];
if(valid.includes(code)||code.startsWith('SUSU')){
localStorage.setItem('susu_pro_activated','true');
localStorage.setItem('susu_active_code',code);
alert('✅ Activated! Welcome to Pro!');
location.href='app.html';
}else{alert('❌ Invalid Code! Pay GH₵250 to 0248643827 and get code');}
}
// If already activated, go to app
if(localStorage.getItem('susu_pro_activated')==='true'){
// don't auto redirect, let user click
document.getElementById('actCode').value=localStorage.getItem('susu_active_code')||'';
}
</script>
</body>
</html>
